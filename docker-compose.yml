services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: promo
      POSTGRES_PASSWORD: promo
      POSTGRES_DB: promo
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U promo -d promo"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://promo:promo@db:5432/promo
    ports:
      - "8000:8000"
    volumes:
      - uploads:/srv/uploads
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  uploads:
